  date: October 2021
  pdf: ../assets/ffabiano_phd_thesis.pdf
  description: |
    My Ph.D. thesis, <i>Planning while Believing to Know</i>, written at the University of Udine under the supervision of Agostino Dovier, Alessandro Dal Palù and Enrico Pontelli.
    It formalizes and develops tools for planning in multi-agent scenarios involving higher-order knowledge or beliefs, and received the Best Ph.D. Thesis Award by GULP in 2022.

