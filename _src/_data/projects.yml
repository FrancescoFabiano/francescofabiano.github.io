- title: deep
  long_title: Dynamic Epistemic logic-basEd Planner
  date: ongoing
  github: https://github.com/FrancescoFabiano/deep
  description: |
    This project implements a solver, called deep, designed following the imperative programming paradigm.
    In particular, the solver is fully developed in C++.
    deep is a general and comprehensive epistemic forward solver that can solve problems defined in mA*.
    Moreover, thanks to the introduction of agents’ attitudes and other capabilities, the planner
    allows the users to tailor actions in whichever fashion they prefer without having
    to worry about tedious and intricate effects definitions.

    <br> Click the github icon in the top-right corner or <a href='https://github.com/FrancescoFabiano/deep' target="_blank">Here</a> to open the project repository.

  tags:
    - research
    - artificial intelligence
    - multi-agent
    - planning
    - epistemic
    - solver
    - planner


