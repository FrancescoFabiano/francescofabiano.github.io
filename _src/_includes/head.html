<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>
  {% if page.title %}{{ site.title | escape }} | {{ page.title | escape }}
  {% else %}{{ site.title | escape }}{% endif %}
</title>

<!-- Preconnect to Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Meta Tags, Open Graph & Structured Data -->
{% include meta.html %}

<!-- Favicons -->
<link
  rel="icon"
  type="image/png"
  sizes="512x512"
  href="/assets/favicons/favicon-512.png">

<link
  rel="icon"
  type="image/png"
  sizes="192x192"
  href="/assets/favicons/favicon-192.png">

<link
  rel="icon"
  type="image/png"
  sizes="48x48"
  href="/assets/favicons/favicon-48.png">

<link
  rel="icon"
  type="image/svg+xml"
  href="/assets/favicons/icon.svg">

<link
  rel="shortcut icon"
  href="/assets/favicons/favicon.ico">

<link
  rel="apple-touch-icon"
  sizes="180x180"
  href="/assets/favicons/apple-touch-icon.png">

<!-- PWA -->
<link
  rel="manifest"
  href="/assets/manifest.webmanifest"
  crossorigin="anonymous">

<meta name="theme-color" content="#25274d">

<!-- Main Stylesheet -->
<link rel="stylesheet" href="/assets/css/main.css">

{% include gtag.html %}
