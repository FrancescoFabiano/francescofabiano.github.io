<meta name="title" content="{{ site.title | escape }}">
<meta name="description" content="{{ site.description | strip_newlines | escape }}">

<!-- Canonical URL -->
<link rel="canonical" href="{{ site.url }}{{ page.url | replace:'index.html','' }}">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:url" content="{{ site.url }}{{ page.url | replace:'index.html','' }}">
<meta property="og:title" content="{% if page.title %}{{ page.title | escape }} | {{ site.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
<meta property="og:description" content="{{ site.description | strip_newlines | escape }}">

<meta property="og:image" content="{{ site.url }}/assets/pic/francesco-fabiano-preview.jpg">
<meta property="og:image:secure_url" content="{{ site.url }}/assets/pic/francesco-fabiano-preview.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="3999">
<meta property="og:image:height" content="3999">
<meta property="og:image:alt" content="Francesco Fabiano">

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="{{ site.url }}{{ page.url | replace:'index.html','' }}">
<meta name="twitter:title" content="{% if page.title %}{{ page.title | escape }} | {{ site.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
<meta name="twitter:description" content="{{ site.description | strip_newlines | escape }}">
<meta name="twitter:image" content="{{ site.url }}/assets/pic/francesco-fabiano-preview.jpg">
<meta name="twitter:image:alt" content="Francesco Fabiano">

<!-- Structured Data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Francesco Fabiano",
  "url": "{{ site.url }}",
  "image": "{{ site.url }}/assets/pic/francesco-fabiano-preview.jpg",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ site.url }}"
  }
}
</script>
